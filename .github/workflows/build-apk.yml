name: Build JobAut Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
  release:
    types:
      - published

jobs:
  build-apk:
    name: Build & Package APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK and CMake via sdkmanager
        run: |
          yes | sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Ensure Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APKs
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JobAut-Native-APK
          path: android/app/build/outputs/apk/**/*.apk

      - name: Publish Direct APK to Continuous Release
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous Build (Direct APK)
          body: |
            Continuous build from commit ${{ github.sha }} on branch `${{ github.ref_name }}`.
            
            Download the raw `.apk` file below directly to install on your Android device (no zip extraction needed).
          prerelease: true
          files: android/app/build/outputs/apk/**/*.apk

      - name: Upload APKs to GitHub Release
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/**/*.apk
